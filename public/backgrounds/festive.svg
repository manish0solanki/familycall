<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#6b2a6e"/>
      <stop offset="1" stop-color="#2a0f33"/>
    </radialGradient>
    <radialGradient id="bulb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d0"/>
      <stop offset="0.35" stop-color="#ffcf5a"/>
      <stop offset="1" stop-color="#ffcf5a" stop-opacity="0"/>
