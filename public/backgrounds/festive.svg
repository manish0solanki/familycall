    <circle cx="80" cy="236" r="26"/><circle cx="200" cy="268" r="26"/><circle cx="320" cy="282" r="26"/><circle cx="440" cy="270" r="26"/>
    <circle cx="560" cy="242" r="26"/><circle cx="720" cy="222" r="26"/><circle cx="840" cy="246" r="26"/><circle cx="960" cy="262" r="26"/>
    <circle cx="1080" cy="252" r="26"/><circle cx="1200" cy="224" r="26"/>
